spring.application.name=transaction

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/transaction_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibrenate.format_sql=true

# =========================
# Kafka
# =========================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Consumer
spring.kafka.consumer.group-id=transaction-notification
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mhf.transaction
spring.kafka.consumer.properties.auto.offset.reset=earliest

# Outbox
outbox.publisher.fixed-delay=5000
outbox.publisher.initial-delay=5000

# =========================
# Redis
# =========================

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# =========================
# Actuator
# =========================

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted

# =========================
# Logging
# =========================

logging.structured.format.file=logstash
logging.file.name=logs/application.log

